# Dependabot version updates.
# Docs: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# This is a pnpm workspace monorepo, so `directories: ["/**"]` lets Dependabot
# discover every package.json (root, apps/*, packages/*) instead of only the root.

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/**"
    open-pull-requests-limit: 20
    versioning-strategy: increase
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels:
      - "dependencies"
    groups:
      # Batch low-risk updates into a single PR per group.
      types:
        applies-to: version-updates
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-config-*"
          - "eslint-plugin-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
      next:
        applies-to: version-updates
        patterns:
          - "next"
          - "next-themes"
          - "@next/*"
          - "eslint-config-next"
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      radix:
        applies-to: version-updates
        patterns:
          - "@radix-ui/*"
      tailwind:
        applies-to: version-updates
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwindcss-animate"
          - "tailwind-merge"
          - "tw-animate-css"
          - "prettier-plugin-tailwindcss"
      turbo:
        applies-to: version-updates
        patterns:
          - "turbo"
          - "@turbo/*"
          - "eslint-plugin-turbo"
      drizzle:
        applies-to: version-updates
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      luxon:
        applies-to: version-updates
        patterns:
          - "luxon"
          - "@types/luxon"
      dev-tooling:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "prettier"
          - "husky"
          - "lint-staged"
          - "syncpack"
          - "typescript"
          - "vite-node"
          - "dotenv-cli"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
